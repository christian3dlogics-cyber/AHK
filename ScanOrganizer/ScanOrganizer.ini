; ============================================================
; ScanOrganizer Settings
; Don't hand-edit this — use ScanOrganizerSettings.ahk instead
; (double-click it for a settings box with a folder picker).
; ============================================================

[General]

; The folder to watch for new scanned PDFs.
; This is usually your Documents folder, or wherever your scanner saves files.
WatchFolder=C:\Users\Christian\Documents

; The folder where dated subfolders will be created.
; A new folder like "07-23-2026" will be made inside this folder for each day.
DestinationFolder=C:\Users\Christian\Documents\scans
